name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        shell: bash
        run: uv run pytest --cov --cov-report=term-missing | tee pytest-coverage.txt

      - name: Build coverage report
        id: coverage
        if: always()
        uses: MishaKav/pytest-coverage-comment@432ac90e8d345c93e1d90ee0838b35913abc9c9b # v1.12.2
        with:
          pytest-coverage-path: backend/pytest-coverage.txt
          coverage-path-prefix: backend/
          hide-comment: true

      - name: Publish coverage summary
        if: always()
        env:
          COVERAGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
        run: echo "$COVERAGE_HTML" >> "$GITHUB_STEP_SUMMARY"

      - name: Run lint checks
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
